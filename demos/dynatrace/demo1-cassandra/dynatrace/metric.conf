# Single place the demo reads its latency metric from (scripts and DQL files source/template this).
# Source: Apache Cassandra extension com.dynatrace.extension.jmx-cassandra (Hub), installed by the presenter.
# No fallback metric is in use.
METRIC_KEY=cassandra.clientRequest.write.latency.95thPercentile
# Unit: Cassandra JMX reports latency percentiles in microseconds. UNVERIFIED in the tenant (unit field was not returned by dtctl).
METRIC_UNIT=us
# Dimensions seen on the series (verified by DQL, 2026-10-10):
#   host.name, dt.entity.host, dt.host_group.id (=demo), k8s.namespace.name (=cassandra-demo),
#   k8s.pod.name (=cassandra-0), dt.smartscape.process
DIM_NODE=k8s.pod.name
DIM_HOSTGROUP=dt.host_group.id
