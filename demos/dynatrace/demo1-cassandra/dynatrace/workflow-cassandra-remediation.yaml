# Demo 1 - guardrailed remediation via pull request. MANUAL trigger: the presenter runs it from the Workflows app.
# Apply with scripts/apply_workflow.sh (fills the email from env).
# Guardrail: the workflow only PROPOSES the fix as a GitHub pull request against the demo1-live branch; a human merges it
# (that is the approval) and Argo CD applies it. The workflow itself changes nothing on the cluster.
# STAND-IN tasks (ticket, PagerDuty) are JavaScript that build a payload and return it. They send nothing.
title: "Cassandra write latency - guardrailed remediation"
description: "DEMO 1. Manual run: latest Cassandra write latency problem -> DQL enrichment -> STAND-IN ticket -> fix proposed as a GitHub pull request (human merges = approval, Argo CD applies) -> email -> STAND-IN PagerDuty. Nothing is applied until a human merges."
type: STANDARD
isPrivate: true
trigger: {}
tasks:
  find_problem:
    name: find_problem
    description: Find the latest Cassandra write latency problem (open or already closed).
    action: dynatrace.automations:execute-dql-query
    input:
      query: |-
        fetch dt.davis.problems, from:now()-24h
        | filter contains(event.name, "Cassandra write latency")
        | sort timestamp desc
        | limit 1
        | fields display_id, event.id, event.name, event.start, event.status, affected_entity_ids
    position: { x: 0, y: 1 }
    predecessors: []
  enrich_latency:
    name: enrich_latency
    description: Affected node, host group, current vs baseline P95 (last 60 min, 1 min resolution; idle zero samples are ignored for the baseline).
    action: dynatrace.automations:execute-dql-query
    input:
      query: |-
        timeseries p95 = avg(cassandra.clientRequest.write.latency.95thPercentile), by: { k8s.pod.name, dt.host_group.id, host.name }, from: now()-60m, interval: 1m, filter: { k8s.namespace.name == "cassandra-demo" }
        | fieldsAdd cur = arrayLast(p95), pk = arrayMax(p95)
        | fieldsAdd v = p95
        | expand v
        | filter v > 0
        | summarize baseline = percentile(v, 10), current = takeFirst(cur), peak = takeFirst(pk), by: { k8s.pod.name, dt.host_group.id, host.name }
    position: { x: 0, y: 2 }
    predecessors: [find_problem]
  ticket_standin:
    name: "STAND-IN: ticket (xMatters / PagerDuty)"
    description: "STAND-IN. Builds the ticket payload and returns it. Sends nothing."
    action: dynatrace.automations:run-javascript
    input:
      script: |-
        import { execution } from '@dynatrace-sdk/automation-utils';

        export default async function ({ execution_id }) {
          const ex = await execution(execution_id);
          const p = (await ex.result('find_problem')).records[0];
          const n = (await ex.result('enrich_latency')).records[0];
          return {
            stand_in: true,
            sent: false,
            target: 'xMatters / PagerDuty ticket (illustrative)',
            payload: {
              summary: p['event.name'],
              problem: p['display_id'],
              node: n['k8s.pod.name'],
              host_group: n['dt.host_group.id'],
              write_latency_p95_us: { current: n['current'], baseline: n['baseline'], peak: n['peak'] },
              severity: 'critical',
            },
          };
        }
    position: { x: 1, y: 3 }
    predecessors: [enrich_latency]
  js_build_fix:
    name: js_build_fix
    description: Build the proposed ConfigMap change (throttle the bulk-load job), branch name and pull request text.
    action: dynatrace.automations:run-javascript
    input:
      script: |-
        import { execution } from '@dynatrace-sdk/automation-utils';

        export default async function ({ execution_id }) {
          const ex = await execution(execution_id);
          const p = (await ex.result('find_problem')).records[0];
          const n = (await ex.result('enrich_latency')).records[0];
          const branch = `demo1/throttle-bulk-load-${Date.now()}`;
          const fileContent = [
            '# Managed by Argo CD from the demo1-live branch (never main). The bulk-load job (cassandra-stress-burst) reads this live.',
            '# Proposed by the Dynatrace workflow for ' + p['display_id'] + '. Merging this pull request is the approval.',
            'apiVersion: v1',
            'kind: ConfigMap',
            'metadata:',
            '  name: bulk-ingest-config',
            '  namespace: cassandra-demo',
            '  labels:',
            '    app.kubernetes.io/part-of: demo1-cassandra',
            'data:',
            '  # full      = unthrottled bulk load, 200 threads (saturates the write path: the demo\'s cause)',
            '  # throttled = 4 threads at 100 ops/s (latency returns to baseline)',
            '  mode: throttled',
            ''
          ].join('\n');
          const prBody = [
            '## ' + p['event.name'],
            '',
            `Dynatrace problem **${p['display_id']}** on node **${n['k8s.pod.name']}** (host group ${n['dt.host_group.id']}).`,
            '',
            `Write latency P95: now **${n['current']} us**, baseline ${n['baseline']} us, peak ${n['peak']} us (threshold 200 us).`,
            '',
            '**Proposed remediation:** throttle the bulk-load job (`cassandra-stress-burst`) from 200 unthrottled threads to 4 threads at 100 ops/s by setting `mode: throttled` in `bulk-ingest-config`. The job is not stopped or deleted, and reverting this change restores the previous load.',
            '',
            '**Guardrail:** nothing changes until a human reviews and merges this pull request. Argo CD then applies it.',
            '',
            'Opened by the Dynatrace workflow "Cassandra write latency - guardrailed remediation" (DEMO 1).'
          ].join('\n');
          return {
            branch,
            fileContent,
            commitMessage: `Throttle bulk-load job for ${p['display_id']}`,
            prTitle: `[Dynatrace ${p['display_id']}] Cassandra write latency - throttle bulk load`,
            prBody
          };
        }
    position: { x: 0, y: 3 }
    predecessors: [enrich_latency]
  create_fix_branch:
    name: create_fix_branch
    description: Create the fix branch off demo1-live and commit the ConfigMap change.
    action: dynatrace.github.connector:create-or-replace-file
    input:
      branch: '{{ result("js_build_fix")["branch"] }}'
      commitMessage: '{{ result("js_build_fix")["commitMessage"] }}'
      connectionId: vu9U3hXa3q0AAAABAClhcHA6ZHluYXRyYWNlLmdpdGh1Yi5jb25uZWN0b3I6Y29ubmVjdGlvbgAGdGVuYW50AAZ0ZW5hbnQAJDk3N2UxODhmLWQ2NjEtMzAxMS1hYzRjLWVjNmNhMjIxYzFlNr7vVN4V2t6t
      createNewBranch: true
      fileContent: '{{ result("js_build_fix")["fileContent"] }}'
      filePath: demos/dynatrace/demo1-cassandra/gitops-repo/apps/bulk-ingest/configmap.yaml
      owner: jib94
      repository: homelab
      sourceBranch: demo1-live
    position: { x: 0, y: 4 }
    predecessors: [js_build_fix]
  open_fix_pr:
    name: open_fix_pr
    description: "GUARDRAIL: open the pull request into demo1-live. A human must review and merge it; nothing is applied before that."
    action: dynatrace.github.connector:create-pull-request
    input:
      connectionId: vu9U3hXa3q0AAAABAClhcHA6ZHluYXRyYWNlLmdpdGh1Yi5jb25uZWN0b3I6Y29ubmVjdGlvbgAGdGVuYW50AAZ0ZW5hbnQAJDk3N2UxODhmLWQ2NjEtMzAxMS1hYzRjLWVjNmNhMjIxYzFlNr7vVN4V2t6t
      description: '{{ result("js_build_fix")["prBody"] }}'
      owner: jib94
      repository: homelab
      sourceBranch: '{{ result("js_build_fix")["branch"] }}'
      targetBranch: demo1-live
      title: '{{ result("js_build_fix")["prTitle"] }}'
    position: { x: 0, y: 5 }
    predecessors: [create_fix_branch]
  js_pr_link:
    name: js_pr_link
    description: Pull the PR URL out of the connector result (falls back to the repo PR list).
    action: dynatrace.automations:run-javascript
    input:
      script: |-
        import { execution } from '@dynatrace-sdk/automation-utils';

        export default async function ({ execution_id }) {
          const ex = await execution(execution_id);
          const r = await ex.result('open_fix_pr');
          let url = null;
          const walk = (o) => {
            if (url || o == null) return;
            if (typeof o === 'string') { if (/^https?:\/\/github\.com\/.+\/pull\/\d+/.test(o)) url = o; return; }
            if (typeof o === 'object') Object.values(o).forEach(walk);
          };
          walk(r);
          return { pr_url: url || 'https://github.com/jib94/homelab/pulls' };
        }
    position: { x: 0, y: 6 }
    predecessors: [open_fix_pr]
  send_email:
    name: send_email
    description: Email root-cause context and the pull request link to the on-call.
    action: dynatrace.email:send-email
    input:
      to: ["REPLACE_DEMO_EMAIL"]
      cc: []
      bcc: []
      subject: 'ACTION NEEDED: {{ result("find_problem").records[0]["event.name"] }}'
      content: |-
        Problem {{ result("find_problem").records[0]["display_id"] }}: {{ result("find_problem").records[0]["event.name"] }}

        Node: {{ result("enrich_latency").records[0]["k8s.pod.name"] }} (host {{ result("enrich_latency").records[0]["host.name"] }}, host group {{ result("enrich_latency").records[0]["dt.host_group.id"] }})
        Write latency P95: now {{ result("enrich_latency").records[0]["current"] }} us, baseline {{ result("enrich_latency").records[0]["baseline"] }} us, peak {{ result("enrich_latency").records[0]["peak"] }} us.

        A fix has been PROPOSED as a pull request. Nothing is applied until you review and merge it:
        {{ result("js_pr_link")["pr_url"] }}

        The ticket and PagerDuty steps in this demo are STAND-INS.
    position: { x: 0, y: 7 }
    predecessors: [js_pr_link]
  pagerduty_standin:
    name: "STAND-IN: PagerDuty notify (Events API v2 shape)"
    description: "STAND-IN. Shows what a PagerDuty event could look like. Not connected to PagerDuty; sends nothing."
    action: dynatrace.automations:run-javascript
    input:
      script: |-
        import { execution } from '@dynatrace-sdk/automation-utils';

        export default async function ({ execution_id }) {
          const ex = await execution(execution_id);
          const p = (await ex.result('find_problem')).records[0];
          const n = (await ex.result('enrich_latency')).records[0];
          const l = await ex.result('js_pr_link');
          return {
            stand_in: true,
            sent: false,
            target: 'PagerDuty Events API v2 (illustrative, not connected)',
            payload: {
              routing_key: 'STAND-IN-NOT-A-REAL-KEY',
              event_action: 'trigger',
              dedup_key: p['display_id'],
              payload: {
                summary: p['event.name'] + ' - fix proposed as PR, awaiting human merge',
                source: n['k8s.pod.name'],
                severity: 'critical',
                component: 'cassandra',
                group: n['dt.host_group.id'],
                custom_details: { latency_p95_us_now: n['current'], baseline_us: n['baseline'], threshold_us: 200, pull_request: l['pr_url'] },
              },
            },
          };
        }
    position: { x: 0, y: 8 }
    predecessors: [send_email, ticket_standin]
