# Demo 1 - guardrailed auto-remediation via pull request. Apply with scripts/apply_workflow.sh (fills the email from env).
# Guardrail: the workflow only PROPOSES the fix as a GitHub pull request; a human merges it (that is the approval).
# STAND-IN tasks (ticket, PagerDuty) are JavaScript that build a payload and return it. They send nothing.
# Works on a pre-existing open problem: find_problem looks it up by DQL, so a trigger run and a manual run behave the same.
title: "Cassandra write latency - guardrailed remediation"
description: "DEMO 1. Davis problem -> DQL enrichment -> STAND-IN ticket -> fix proposed as a GitHub pull request (human merges = approval) -> email -> verify -> STAND-IN PagerDuty. Nothing is applied until a human merges."
type: STANDARD
isPrivate: true
trigger:
  eventTrigger:
    isActive: true
    filterQuery: event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND matchesValue(event.status_transition, {"CREATED"}) AND matchesValue(event.name, "*Cassandra write latency*")
    triggerConfiguration:
      type: davis-problem
      value:
        analysisReady: true
        categories:
          availability: true
          custom: true
          error: true
          resource: true
          slowdown: true
        customFilter: 'matchesValue(event.name, "*Cassandra write latency*")'
        entityTags: {}
        entityTagsMatch: null
        onProblemClose: false
        problemOpenDuration: null
        severityThreshold: null
        triggerOn: null
        triggerOnUpdateFields: []
    uniqueExpression: '{{ event()["event.id"] }}'
tasks:
  find_problem:
    name: find_problem
    description: Find the open Cassandra write latency problem (works for trigger or manual run). Waits 60 s so a just-opened problem has reached Grail.
    action: dynatrace.automations:execute-dql-query
    waitBefore: 60
    input:
      query: |-
        fetch dt.davis.problems, from:now()-24h
        | filter event.status == "ACTIVE" and contains(event.name, "Cassandra write latency")
        | sort timestamp desc
        | limit 1
        | fields display_id, event.id, event.name, event.start, event.status, affected_entity_ids
    position: { x: 0, y: 1 }
    predecessors: []
  enrich_latency:
    name: enrich_latency
    description: Affected node, host group, current vs baseline P95 (last 60 min, 1 min resolution).
    action: dynatrace.automations:execute-dql-query
    input:
      query: |-
        timeseries p95 = avg(cassandra.clientRequest.write.latency.95thPercentile), by: { k8s.pod.name, dt.host_group.id, host.name }, from: now()-60m, interval: 1m, filter: { k8s.namespace.name == "cassandra-demo" }
        | fieldsAdd baseline = arrayPercentile(p95, 10), current = arrayLast(p95), peak = arrayMax(p95)
        | fields k8s.pod.name, dt.host_group.id, host.name, baseline, current, peak, p95
    position: { x: 0, y: 2 }
    predecessors: [find_problem]
  ticket_standin:
    name: "STAND-IN: ticket (xMatters / PagerDuty)"
    description: "STAND-IN. Builds the ticket payload and returns it. Sends nothing."
    action: dynatrace.automations:run-javascript
    input:
      script: |-
        import { execution } from '@dynatrace-sdk/automation-utils';

        export default async function ({ execution_id }) {
          const ex = await execution(execution_id);
          const p = (await ex.result('find_problem')).records[0];
          const n = (await ex.result('enrich_latency')).records[0];
          return {
            stand_in: true,
            sent: false,
            target: 'xMatters / PagerDuty ticket (illustrative)',
            payload: {
              summary: p['event.name'],
              problem: p['display_id'],
              node: n['k8s.pod.name'],
              host_group: n['dt.host_group.id'],
              write_latency_p95_us: { current: n['current'], baseline: n['baseline'], peak: n['peak'] },
              severity: 'critical',
            },
          };
        }
    position: { x: 1, y: 3 }
    predecessors: [enrich_latency]
  js_build_fix:
    name: js_build_fix
    description: Build the proposed tuning file, branch name and pull request text.
    action: dynatrace.automations:run-javascript
    input:
      script: |-
        import { execution } from '@dynatrace-sdk/automation-utils';

        export default async function ({ execution_id }) {
          const ex = await execution(execution_id);
          const p = (await ex.result('find_problem')).records[0];
          const n = (await ex.result('enrich_latency')).records[0];
          const branch = `demo1/cassandra-tuning-${Date.now()}`;
          const fileContent = [
            '# Proposed by Dynatrace workflow for ' + p['display_id'] + ' (illustrative; review before merge)',
            'apiVersion: v1',
            'kind: ConfigMap',
            'metadata:',
            '  name: cassandra-tuning-proposal',
            '  namespace: cassandra-demo',
            '  labels:',
            '    app.kubernetes.io/part-of: demo1-cassandra',
            'data:',
            '  proposal.yaml: |',
            '    compaction_throughput: 64MiB/s',
            '    concurrent_compactors: 2',
            '    memtable_flush_writers: 4',
            ''
          ].join('\n');
          const prBody = [
            '## ' + p['event.name'],
            '',
            `Dynatrace problem **${p['display_id']}** on node **${n['k8s.pod.name']}** (host group ${n['dt.host_group.id']}).`,
            '',
            `Write latency P95: now **${n['current']} us**, baseline ${n['baseline']} us, peak ${n['peak']} us (threshold 200 us).`,
            '',
            'Proposed remediation: raise compaction throughput and memtable flush writers (illustrative settings).',
            '',
            '**Guardrail:** nothing changes until a human reviews and merges this pull request.',
            '',
            'Opened by the Dynatrace workflow "Cassandra write latency - guardrailed remediation" (DEMO 1).'
          ].join('\n');
          return {
            branch,
            fileContent,
            commitMessage: `Propose Cassandra tuning for ${p['display_id']}`,
            prTitle: `[Dynatrace ${p['display_id']}] Cassandra write latency - proposed tuning`,
            prBody
          };
        }
    position: { x: 0, y: 3 }
    predecessors: [enrich_latency]
  create_fix_branch:
    name: create_fix_branch
    description: Create the fix branch off main and commit the proposed tuning file.
    action: dynatrace.github.connector:create-or-replace-file
    input:
      branch: '{{ result("js_build_fix")["branch"] }}'
      commitMessage: '{{ result("js_build_fix")["commitMessage"] }}'
      connectionId: vu9U3hXa3q0AAAABAClhcHA6ZHluYXRyYWNlLmdpdGh1Yi5jb25uZWN0b3I6Y29ubmVjdGlvbgAGdGVuYW50AAZ0ZW5hbnQAJDk3N2UxODhmLWQ2NjEtMzAxMS1hYzRjLWVjNmNhMjIxYzFlNr7vVN4V2t6t
      createNewBranch: true
      fileContent: '{{ result("js_build_fix")["fileContent"] }}'
      filePath: demos/dynatrace/demo1-cassandra/remediation/cassandra-tuning.yaml
      owner: jib94
      repository: homelab
      sourceBranch: main
    position: { x: 0, y: 4 }
    predecessors: [js_build_fix]
  open_fix_pr:
    name: open_fix_pr
    description: "GUARDRAIL: open the pull request. A human must review and merge it; nothing is applied before that."
    action: dynatrace.github.connector:create-pull-request
    input:
      connectionId: vu9U3hXa3q0AAAABAClhcHA6ZHluYXRyYWNlLmdpdGh1Yi5jb25uZWN0b3I6Y29ubmVjdGlvbgAGdGVuYW50AAZ0ZW5hbnQAJDk3N2UxODhmLWQ2NjEtMzAxMS1hYzRjLWVjNmNhMjIxYzFlNr7vVN4V2t6t
      description: '{{ result("js_build_fix")["prBody"] }}'
      owner: jib94
      repository: homelab
      sourceBranch: '{{ result("js_build_fix")["branch"] }}'
      targetBranch: main
      title: '{{ result("js_build_fix")["prTitle"] }}'
    position: { x: 0, y: 5 }
    predecessors: [create_fix_branch]
  js_pr_link:
    name: js_pr_link
    description: Pull the PR URL out of the connector result (falls back to the repo PR list).
    action: dynatrace.automations:run-javascript
    input:
      script: |-
        import { execution } from '@dynatrace-sdk/automation-utils';

        export default async function ({ execution_id }) {
          const ex = await execution(execution_id);
          const r = await ex.result('open_fix_pr');
          let url = null;
          const walk = (o) => {
            if (url || o == null) return;
            if (typeof o === 'string') { if (/^https?:\/\/github\.com\/.+\/pull\/\d+/.test(o)) url = o; return; }
            if (typeof o === 'object') Object.values(o).forEach(walk);
          };
          walk(r);
          return { pr_url: url || 'https://github.com/jib94/homelab/pulls' };
        }
    position: { x: 0, y: 6 }
    predecessors: [open_fix_pr]
  send_email:
    name: send_email
    description: Email root-cause context and the pull request link to the on-call.
    action: dynatrace.email:send-email
    input:
      to: ["REPLACE_DEMO_EMAIL"]
      cc: []
      bcc: []
      subject: 'ACTION NEEDED: {{ result("find_problem").records[0]["event.name"] }}'
      content: |-
        Problem {{ result("find_problem").records[0]["display_id"] }}: {{ result("find_problem").records[0]["event.name"] }}

        Node: {{ result("enrich_latency").records[0]["k8s.pod.name"] }} (host {{ result("enrich_latency").records[0]["host.name"] }}, host group {{ result("enrich_latency").records[0]["dt.host_group.id"] }})
        Write latency P95: now {{ result("enrich_latency").records[0]["current"] }} us, baseline {{ result("enrich_latency").records[0]["baseline"] }} us, peak {{ result("enrich_latency").records[0]["peak"] }} us.

        A fix has been PROPOSED as a pull request. Nothing is applied until you review and merge it:
        {{ result("js_pr_link")["pr_url"] }}

        The ticket and PagerDuty steps in this demo are STAND-INS.
    position: { x: 0, y: 7 }
    predecessors: [js_pr_link]
  verify:
    name: verify
    description: Re-check latency against the 200 us threshold. Reports the truth, success or not (expected right after the PR - still above, awaiting merge).
    action: dynatrace.automations:execute-dql-query
    input:
      query: |-
        timeseries p95 = avg(cassandra.clientRequest.write.latency.95thPercentile), by: { k8s.pod.name }, from: now()-5m, interval: 1m, filter: { k8s.namespace.name == "cassandra-demo" }
        | fieldsAdd current = arrayLast(p95)
        | fieldsAdd threshold = 200, back_under_threshold = current < 200
        | fields k8s.pod.name, current, threshold, back_under_threshold
    position: { x: 0, y: 8 }
    predecessors: [send_email, ticket_standin]
  pagerduty_standin:
    name: "STAND-IN: PagerDuty notify (Events API v2 shape)"
    description: "STAND-IN. Shows what a PagerDuty event could look like. Not connected to PagerDuty; sends nothing."
    action: dynatrace.automations:run-javascript
    input:
      script: |-
        import { execution } from '@dynatrace-sdk/automation-utils';

        export default async function ({ execution_id }) {
          const ex = await execution(execution_id);
          const p = (await ex.result('find_problem')).records[0];
          const n = (await ex.result('enrich_latency')).records[0];
          const v = (await ex.result('verify')).records[0];
          const l = await ex.result('js_pr_link');
          const recovered = v['back_under_threshold'] === true;
          return {
            stand_in: true,
            sent: false,
            target: 'PagerDuty Events API v2 (illustrative, not connected)',
            payload: {
              routing_key: 'STAND-IN-NOT-A-REAL-KEY',
              event_action: recovered ? 'resolve' : 'trigger',
              dedup_key: p['display_id'],
              payload: {
                summary: p['event.name'] + (recovered ? ' - latency back under threshold' : ' - fix proposed as PR, awaiting human merge'),
                source: n['k8s.pod.name'],
                severity: recovered ? 'info' : 'critical',
                component: 'cassandra',
                group: n['dt.host_group.id'],
                custom_details: { latency_p95_us_now: v['current'], threshold_us: v['threshold'], pull_request: l['pr_url'] },
              },
            },
          };
        }
    position: { x: 0, y: 9 }
    predecessors: [verify]
