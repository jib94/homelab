# Managed by Argo CD from the demo1-live branch (never main). The bulk-load job (cassandra-stress-burst) reads this live.
# Proposed by the Dynatrace workflow for P-261068. Merging this pull request is the approval.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bulk-ingest-config
  namespace: cassandra-demo
  labels:
    app.kubernetes.io/part-of: demo1-cassandra
data:
  # full      = unthrottled bulk load, 200 threads (saturates the write path: the demo's cause)
  # throttled = 4 threads at 100 ops/s (latency returns to baseline)
  mode: throttled
