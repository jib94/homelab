# Baseline write load. Tune THROTTLE/THREADS for the latency knob (Phase 3).
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-stress
  namespace: cassandra-demo
  labels:
    app.kubernetes.io/name: cassandra-stress
    app.kubernetes.io/part-of: demo1-cassandra
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra-stress
        app.kubernetes.io/part-of: demo1-cassandra
    spec:
      restartPolicy: Never
      containers:
        - name: stress
          image: cassandra:4.1
          command: ["bash", "-c"]
          args:
            - |
              STRESS=/opt/cassandra/tools/bin/cassandra-stress
              echo "stress: $(ls -l $STRESS 2>&1)"
              until cqlsh cassandra-0.cassandra -e 'describe keyspaces' >/dev/null 2>&1; do
                echo "waiting for cassandra"; sleep 10
              done
              exec $STRESS write duration=8h \
                -rate threads=8 throttle=300/s \
                -node cassandra-0.cassandra
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
