# Workflow 3 of 3 (advanced): problem -> get ownership -> AI remediation steps -> email the teams -> PagerDuty incident
# -> comment on the problem -> list on-calls -> list escalation policies -> match severity to a policy -> contact that on-call.
# TEMPLATE using the real actions. No owners, Slack or PagerDuty connection exist in this tenant, so it is not meant to run;
# it is for walking through the steps and the Jinja. Trigger is DISABLED (isActive: false).
# Input field names confirmed from a UI export: PagerDuty `incidentKey`, email to/subject/content. All other action input names
# (entityIds, prompt, problemId, comment, ...) are best guesses; check them in the Workflows UI before enabling.
# The final "contact the on-call" step is an email to $DEMO_EMAIL standing in for the on-call addresses.
# Apply with: DEMO_EMAIL=... ./apply_trio.sh <this file>   (id kept in the .id file next to it)
title: "3 - Advanced: AI remediation + notify + escalate"
description: "Trio, level 3 (template). Problem -> ownership -> Dynatrace AI remediation steps -> email the teams -> PagerDuty incident -> comment on the problem -> on-calls and escalation policies -> match severity -> contact the on-call. Real actions, Jinja in the inputs, no connections configured. Trigger disabled."
type: STANDARD
isPrivate: true
trigger:
  eventTrigger:
    isActive: false
    filterQuery: event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND matchesValue(event.status_transition, {"CREATED", "REOPENED"}) AND matchesValue(event.name, "*Image pull failure*")
    triggerConfiguration:
      type: davis-problem
      value:
        analysisReady: false
        categories:
          availability: true
          custom: true
          error: true
          resource: true
          slowdown: true
        customFilter: matchesValue(event.name, "*Image pull failure*")
        entityTags: {}
        entityTagsMatch: null
        onProblemClose: false
        problemOpenDuration: null
        severityThreshold: null
        triggerOn: null
        triggerOnUpdateFields: []
    uniqueExpression: '{{ event()["event.id"] }}-{{ event()["dt.davis.last_reopen_timestamp"] }}'
triggerType: Event
hourlyExecutionLimit: 20
tasks:
  get_owners:
    name: get_owners
    description: Retrieves the owners of the problem's affected entities.
    action: dynatrace.ownership:get-ownership-from-entity
    input:
      entityIds: '{{ event()["affected_entity_ids"] }}'
    position: { x: 0, y: 1 }
    predecessors: []
  analyze_with_ai:
    name: analyze_with_ai
    description: Dynatrace AI analyses the problem and prepares remediation steps for the owning teams.
    action: dynatrace.davis.workflow.actions:prompt-agentic-ai
    input:
      prompt: |-
        Analyze Dynatrace problem {{ event()["display_id"] }}: "{{ event()["event.name"] }}" (category {{ event()["event.category"] }}, started {{ event()["event.start"] }}).
        Affected entities: {{ event()["affected_entity_ids"] }}.
        Owning teams: {{ result("get_owners") }}.
        Give the likely cause and 3 to 5 numbered remediation steps for the owning teams, most likely first. Only state what the evidence supports.
    conditions:
      states:
        get_owners: OK
    position: { x: 0, y: 2 }
    predecessors: [get_owners]
  email_teams:
    name: email_teams
    description: Email the AI remediation steps to the owning teams (stand-in address; a real run would use the team emails from ownership).
    action: dynatrace.email:send-email
    input:
      to: ["REPLACE_DEMO_EMAIL"]
      cc: []
      bcc: []
      subject: '[{{ event()["display_id"] }}] {{ event()["event.name"] }} - suggested remediation'
      content: |-
        Owners: {{ result("get_owners") }}

        Problem {{ event()["display_id"] }}: {{ event()["event.name"] }}
        Started: {{ event()["event.start"] }}

        Suggested remediation (Dynatrace AI):
        {{ result("analyze_with_ai") }}
    conditions:
      states:
        analyze_with_ai: OK
    position: { x: 0, y: 3 }
    predecessors: [analyze_with_ai]
  create_incident:
    name: create_incident
    description: Create a PagerDuty incident for the problem.
    action: dynatrace.pagerduty:create-incident
    input:
      incidentKey: 'DT_{{ event()["event.id"] }}'
      title: '{{ event()["event.name"] }}'
      body: 'Dynatrace problem {{ event()["display_id"] }} ({{ event()["event.category"] }}). Remediation steps were emailed to the owning teams.'
    conditions:
      states:
        email_teams: OK
    position: { x: 0, y: 4 }
    predecessors: [email_teams]
  comment_on_problem:
    name: comment_on_problem
    description: Annotate the problem to say who was notified and that the incident exists.
    action: dynatrace.davis.problems:annotate-and-link
    input:
      problemId: '{{ event()["event.id"] }}'
      comment: 'Owning teams notified: {{ result("get_owners") }}. PagerDuty incident created (key DT_{{ event()["event.id"] }}). Remediation steps were emailed.'
    conditions:
      states:
        create_incident: OK
    position: { x: 0, y: 5 }
    predecessors: [create_incident]
  list_on_calls:
    name: list_on_calls
    description: Retrieves everyone currently on call.
    action: dynatrace.pagerduty:list-on-calls
    input: {}
    conditions:
      states:
        comment_on_problem: OK
    position: { x: 0, y: 6 }
    predecessors: [comment_on_problem]
  list_escalation_policies:
    name: list_escalation_policies
    description: Retrieves the escalation policies.
    action: dynatrace.pagerduty:list-escalation-policies
    input: {}
    conditions:
      states:
        list_on_calls: OK
    position: { x: 0, y: 7 }
    predecessors: [list_on_calls]
  contact_on_call:
    name: contact_on_call
    description: Match the problem's severity to an escalation policy and contact that on-call team (email to a stand-in address).
    action: dynatrace.email:send-email
    input:
      to: ["REPLACE_DEMO_EMAIL"]
      cc: []
      bcc: []
      subject: '[{{ event()["display_id"] }}] On-call page: {{ "P1 - Critical" if event()["event.category"] == "AVAILABILITY" else ("P2 - High" if event()["event.category"] == "ERROR" else "P3 - Low") }}'
      content: |-
        Problem {{ event()["display_id"] }}: {{ event()["event.name"] }}
        Severity (Davis category): {{ event()["event.category"] }}
        Matched escalation policy: {{ "P1 - Critical" if event()["event.category"] == "AVAILABILITY" else ("P2 - High" if event()["event.category"] == "ERROR" else "P3 - Low") }}

        Escalation policies: {{ result("list_escalation_policies") }}
        On-calls: {{ result("list_on_calls") }}
    conditions:
      states:
        list_escalation_policies: OK
    position: { x: 0, y: 8 }
    predecessors: [list_escalation_policies]
