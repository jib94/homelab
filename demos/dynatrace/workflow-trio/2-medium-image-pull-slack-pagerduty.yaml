# Workflow 2 of 3 (medium): image pull problem -> get ownership -> Slack message to the owners -> PagerDuty incident.
# TEMPLATE using the real actions. No owners, Slack or PagerDuty connection exist in this tenant, so it is not meant to run;
# it is for walking through the steps and the Jinja. Trigger is DISABLED (isActive: false).
# Input field names confirmed from a UI export: Slack `message`/`messageFormat`, PagerDuty `incidentKey`.
# Other input names (entityIds, title, ...) are best guesses; check them in the Workflows UI before enabling.
# Apply with: DEMO_EMAIL=... ./apply_trio.sh <this file>   (id kept in the .id file next to it)
title: "2 - Medium: image pull problem -> owners -> Slack -> PagerDuty"
description: "Trio, level 2 (template). Davis problem for an image pull failure -> get ownership of the affected entities -> Slack message to the owners -> PagerDuty incident. Real actions, Jinja in the inputs, no connections configured. Trigger disabled."
type: STANDARD
isPrivate: true
trigger:
  eventTrigger:
    isActive: false
    filterQuery: event.kind == "DAVIS_PROBLEM" AND event.status == "ACTIVE" AND matchesValue(event.status_transition, {"CREATED", "REOPENED"}) AND matchesValue(event.name, "*Image pull failure*")
    triggerConfiguration:
      type: davis-problem
      value:
        analysisReady: false
        categories:
          availability: true
          custom: true
          error: true
          resource: true
          slowdown: true
        customFilter: matchesValue(event.name, "*Image pull failure*")
        entityTags: {}
        entityTagsMatch: null
        onProblemClose: false
        problemOpenDuration: null
        severityThreshold: null
        triggerOn: null
        triggerOnUpdateFields: []
    uniqueExpression: '{{ event()["event.id"] }}-{{ event()["dt.davis.last_reopen_timestamp"] }}'
triggerType: Event
hourlyExecutionLimit: 20
tasks:
  get_owners:
    name: get_owners
    description: Retrieves the owners of the problem's affected entities.
    action: dynatrace.ownership:get-ownership-from-entity
    input:
      entityIds: '{{ event()["affected_entity_ids"] }}'
    position: { x: 0, y: 1 }
    predecessors: []
  send_slack_message:
    name: send_slack_message
    description: Message the owning team in Slack with the problem details.
    action: dynatrace.slack:slack-send-message
    input:
      messageFormat: dynatrace_markdown
      message: |-
        :rotating_light: *{{ event()["event.name"] }}* ({{ event()["display_id"] }})
        Category: {{ event()["event.category"] }}
        Started: {{ event()["event.start"] }}
        Owners: {{ result("get_owners") }}
        Workflow run started {{ execution().started_at }}.
      appendToThread: false
      replyBroadcast: false
    conditions:
      states:
        get_owners: OK
    position: { x: 0, y: 2 }
    predecessors: [get_owners]
  create_incident:
    name: create_incident
    description: Create a PagerDuty incident for the problem.
    action: dynatrace.pagerduty:create-incident
    input:
      incidentKey: 'DT_{{ event()["event.id"] }}'
      title: '{{ event()["event.name"] }}'
      body: 'Dynatrace problem {{ event()["display_id"] }} ({{ event()["event.category"] }}). Owners: {{ result("get_owners") }}. Slack was notified.'
    conditions:
      states:
        send_slack_message: OK
    position: { x: 0, y: 3 }
    predecessors: [send_slack_message]
