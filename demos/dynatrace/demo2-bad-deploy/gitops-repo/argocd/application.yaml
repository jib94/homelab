# Applied ONCE by the user (argocd namespace is protected for Claude):
#   kubectl --context homelab-rw apply -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: settlement-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jib94/homelab.git
    targetRevision: demo2-live
    path: demos/dynatrace/demo2-bad-deploy/gitops-repo/apps/settlement-service
  destination:
    server: https://kubernetes.default.svc
    namespace: payments-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
